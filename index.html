<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0b1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>AI MUSIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* AI MUSIC: phone-first music streaming. Dark purple stage, one gold action colour; red/ice only for the Kouhaku event. */
:root {
  --font-display: "Dela Gothic One", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --bg: #0f0b1a;
  --surface: #181326;
  --surface-2: #221b36;
  --line: #2e2645;
  --fg: #f4f1fa;
  --muted: #a39bbd;
  --red: #ff6a80;
  --red-fill: #d8213f;
  --on-red: #ffffff;
  --ice: #bcd7ff;
  --ice-fill: #cfe2ff;
  --on-ice: #0c1a36;
  --gold: #ffc83d;
  --gold-ink: #ffc83d;
  --on-gold: #2b1d00;
  --silver: #c9d0e0;
  --bronze: #e0a27a;
  --bar: rgba(15, 11, 26, 0.94);
  --stage-a: rgba(216, 33, 63, 0.55);
  --stage-b: rgba(120, 170, 255, 0.4);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f3fb; --surface: #ffffff; --surface-2: #ece7f6; --line: #ddd5ee;
    --fg: #1c1530; --muted: #6b6385; --red: #c01230; --ice: #1f5bb5; --ice-fill: #dbe8ff;
    --on-ice: #14376f; --gold-ink: #8f6200; --silver: #6d7690; --bronze: #99572d;
    --bar: rgba(255, 255, 255, 0.94); --stage-a: rgba(216, 33, 63, 0.3); --stage-b: rgba(60, 120, 220, 0.28);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f6f3fb; --surface: #ffffff; --surface-2: #ece7f6; --line: #ddd5ee;
  --fg: #1c1530; --muted: #6b6385; --red: #c01230; --ice: #1f5bb5; --ice-fill: #dbe8ff;
  --on-ice: #14376f; --gold-ink: #8f6200; --silver: #6d7690; --bronze: #99572d;
  --bar: rgba(255, 255, 255, 0.94); --stage-a: rgba(216, 33, 63, 0.3); --stage-b: rgba(60, 120, 220, 0.28);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.app { max-width: 520px; margin: 0 auto; padding-block: 14px 150px; }
.tnum { font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 14px; }
.wm { display: flex; flex-direction: column; line-height: 1; }
.wm-en { font-size: 11px; letter-spacing: 0.28em; color: var(--muted); font-weight: 700; }
.wm-jp { font-family: var(--font-display); font-size: 30px; letter-spacing: 0.02em; margin-top: 4px; }
.wm-jp i { font-style: normal; }
.wm-jp i { color: var(--gold-ink); }
.pill { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }

/* hero */
.hero {
  border-radius: 18px; padding: 18px 16px 16px; border: 1px solid var(--line);
  background:
    radial-gradient(120% 90% at 0% 0%, var(--stage-a), transparent 60%),
    radial-gradient(120% 90% at 100% 0%, var(--stage-b), transparent 60%),
    var(--surface);
}
.eyebrow { margin: 0; font-size: 13px; color: var(--muted); font-weight: 500; }
.eyebrow b { color: var(--gold-ink); font-size: 18px; }
.hero h2 { margin: 6px 0 14px; font-size: 20px; line-height: 1.35; text-wrap: balance; font-weight: 700; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.side { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.side.ice { text-align: right; align-items: flex-end; }
.side .k { font-family: var(--font-display); font-size: 22px; }
.side.red .k { color: var(--red); }
.side.ice .k { color: var(--ice); }
.side b { font-size: 24px; font-weight: 700; line-height: 1.1; }
.side small { color: var(--muted); font-size: 12px; }
.vsmark { font-family: var(--font-display); font-size: 26px; color: var(--gold-ink); font-style: italic; }
.bar { height: 10px; border-radius: 99px; background: var(--ice-fill); margin: 14px 0 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--red-fill); border-radius: 99px 0 0 99px; }
.lead { margin: 0 0 14px; text-align: center; font-weight: 700; font-size: 14px; }
.cta {
  display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 12px; border: 0;
  background: var(--gold); color: var(--on-gold); font-weight: 700; font-size: 16px; text-decoration: none; width: 100%;
}

/* sections */
.sec { margin-top: 24px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.sec-h h3 { margin: 0; font-size: 17px; font-weight: 700; }
.sec-h a { font-size: 13px; color: var(--muted); text-decoration: none; }
.sub { color: var(--muted); font-size: 13px; margin: 0 0 10px; }

/* track list */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 8px 8px 6px; }
.rank { width: 26px; text-align: center; font-family: var(--font-display); font-size: 16px; color: var(--muted); flex: none; }
.rank.m1 { color: var(--gold-ink); } .rank.m2 { color: var(--silver); } .rank.m3 { color: var(--bronze); }
.rowmain { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left; }
.rt { display: flex; flex-direction: column; min-width: 0; }
.rt b { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rt small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rv { font-size: 12px; color: var(--muted); white-space: nowrap; text-align: right; flex: none; min-width: 62px; }
.badge { flex: none; font-size: 11px; font-weight: 700; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; font-family: var(--font-display); }
.badge.red { background: var(--red-fill); color: var(--on-red); }
.badge.ice { background: var(--ice-fill); color: var(--on-ice); }
.pbtn { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; padding: 0; }
.pbtn svg { width: 16px; height: 16px; fill: currentColor; }
.status { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--gold-ink); }

.cover {
  --h: 330; flex: none; width: 44px; height: 44px; border-radius: 9px; display: grid; place-items: center; color: rgba(255,255,255,0.92);
  font-family: var(--font-display); font-size: 20px;
  background:
    radial-gradient(circle at 25% 20%, hsl(var(--h) 90% 78% / 0.9), transparent 55%),
    linear-gradient(145deg, hsl(var(--h) 72% 52%), hsl(calc(var(--h) + 55) 65% 28%));
}
.cover.lg { width: 100%; height: auto; aspect-ratio: 1; max-width: 100%; font-size: 84px; border-radius: 16px; }
.cover.md { width: 56px; height: 56px; font-size: 24px; }

/* segmented controls and chips */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 8px 6px; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); }
.seg button[data-team="red"][aria-pressed="true"] { background: var(--red-fill); color: var(--on-red); }
.seg button[data-team="ice"][aria-pressed="true"] { background: var(--ice-fill); color: var(--on-ice); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 500; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.stack { display: flex; flex-direction: column; gap: 10px; }

/* battle */
.meta { display: flex; flex-wrap: wrap; gap: 8px; }
.meta .box { flex: 1 1 140px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.meta small { color: var(--muted); font-size: 12px; display: block; }
.meta b { font-size: 20px; }
.match { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.duel { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; }
.cand { display: flex; flex-direction: column; gap: 6px; min-width: 0; align-items: center; text-align: center; }
.cand .cover { width: 100%; height: auto; aspect-ratio: 1; max-width: 120px; font-size: 40px; border-radius: 12px; }
.cand b { font-size: 14px; line-height: 1.3; word-break: break-word; }
.cand small { color: var(--muted); font-size: 12px; }
.cand .votes { font-size: 15px; font-weight: 700; }
.cand .pair { display: flex; gap: 6px; width: 100%; }
.vsc { align-self: center; font-family: var(--font-display); color: var(--gold-ink); font-style: italic; font-size: 18px; }
.vbtn { flex: 1; min-height: 40px; border-radius: 10px; border: 0; font-weight: 700; font-size: 14px; }
.vbtn.red { background: var(--red-fill); color: var(--on-red); }
.vbtn.ice { background: var(--ice-fill); color: var(--on-ice); }
.vbtn.gold { background: var(--gold); color: var(--on-gold); }
.vbtn.line { background: var(--surface-2); border: 1px solid var(--line); color: var(--fg); }
.vbtn[disabled] { opacity: 0.45; cursor: not-allowed; }
.share-bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; margin-top: 12px; background: var(--ice-fill); }
.share-bar i { display: block; background: var(--red-fill); }

/* forms */
form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .lab, legend { font-size: 13px; font-weight: 700; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
input[type="text"], select, textarea {
  width: 100%; min-height: 44px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; color: var(--fg);
}
input[type="file"] { width: 100%; font-size: 13px; color: var(--muted); }
.checks { display: flex; flex-direction: column; gap: 8px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input { margin-top: 4px; width: 18px; height: 18px; flex: none; accent-color: var(--red-fill); }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.err { color: var(--red); font-size: 13px; font-weight: 700; margin: 0; min-height: 1.2em; }
.note { margin-top: 24px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }

/* footer bar */
.foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bar); border-top: 1px solid var(--line); backdrop-filter: blur(10px); }
.foot-in { max-width: 520px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-left, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-right, 0px)); }
.mini { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.mini .rowmain { flex: 1; }
.mini .prog { height: 3px; background: var(--line); border-radius: 3px; flex-basis: 100%; overflow: hidden; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 6px; text-decoration: none; color: var(--muted); font-size: 11px; font-weight: 700; min-height: 52px; }
.tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--fg); }
.tab[aria-current="page"] svg { stroke: var(--gold-ink); }

/* sheet */
.veil { position: fixed; inset: 0; z-index: 40; background: rgba(5, 3, 12, 0.66); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 520px; max-height: 94%; overflow-y: auto; background: var(--bg); border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0;
  padding: 14px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
.sheet-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.x { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 18px; line-height: 1; }
.sheet h2 { margin: 12px 0 2px; font-size: 24px; line-height: 1.25; }
.who { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; flex-wrap: wrap; }
.stats { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin: 10px 0; }
.stats b { color: var(--fg); }
.player { display: flex; align-items: center; gap: 12px; margin: 10px 0; }
.play { flex: none; width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--gold); color: var(--on-gold); display: grid; place-items: center; }
.play svg { width: 22px; height: 22px; fill: currentColor; }
.scrub { flex: 1; min-width: 0; }
.track { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.track i { display: block; height: 100%; width: 0; background: var(--gold); }
.times { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; }
.acts { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 8px; margin: 12px 0 6px; }
.acts .vbtn { display: flex; align-items: center; justify-content: center; gap: 6px; }
.acts svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.acts .vbtn.liked svg { fill: var(--red); stroke: var(--red); }
.comments { display: flex; flex-direction: column; gap: 10px; margin: 10px 0; padding: 0; list-style: none; }
.comments li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.comments small { color: var(--muted); font-size: 12px; display: block; }
.cform { display: flex; gap: 8px; }
.cform input { flex: 1; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60; max-width: min(480px, calc(100% - 32px)); background: var(--fg); color: var(--bg);
  padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 700; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); text-align: center;
}
@media (prefers-reduced-motion: no-preference) {
  .veil { animation: fade 0.18s ease-out; }
  .sheet { animation: rise 0.22s ease-out; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { transform: translateY(24px); opacity: 0.6; } }
}
button.pill { background: none; cursor: pointer; font-family: inherit; min-height: 32px; }
.emptybox { background: var(--surface); border: 1px dashed var(--line); border-radius: 16px; padding: 22px 16px; display: flex; flex-direction: column; gap: 12px; align-items: stretch; text-align: center; margin-top: 16px; }
.emptybox p { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }

/* streaming additions */
svg.s { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pbtn svg.s, .cbtn svg.s { width: 18px; height: 18px; fill: none; stroke: currentColor; }
.pair { display: flex; gap: 8px; }
.pair .vbtn { display: flex; align-items: center; justify-content: center; gap: 6px; }
.pair .vbtn svg.s { width: 16px; height: 16px; }
.hero.home { background: radial-gradient(120% 100% at 0% 0%, rgba(255,200,61,0.22), transparent 60%), radial-gradient(120% 100% at 100% 0%, rgba(150,110,255,0.35), transparent 60%), var(--surface); }
.hero.home .cta svg { width: 18px; height: 18px; }
.ttl { margin: 0 0 12px; font-size: 20px; }
.h3 { margin: 12px 0 4px; font-size: 16px; }
.row.now { border-color: var(--gold); }
.row.now .rt b { color: var(--gold-ink); }
a.rowmain { text-decoration: none; color: inherit; }
.shelf { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; margin-right: -16px; padding-right: 16px; }
.card { flex: none; width: 132px; display: flex; flex-direction: column; gap: 2px; background: none; border: 0; padding: 0; text-align: left; text-decoration: none; color: inherit; }
.card .cover.lg { font-size: 44px; border-radius: 12px; margin-bottom: 6px; }
.card b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cover.round { border-radius: 50%; }
.cover.xl { width: 140px; height: 140px; font-size: 56px; }
.sbox { width: 100%; min-height: 46px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 9px 18px; color: var(--fg); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { --h: 260; min-height: 78px; border-radius: 14px; border: 0; padding: 12px; text-align: left; display: flex; flex-direction: column; justify-content: flex-end; color: #fff; background: linear-gradient(145deg, hsl(var(--h) 65% 46%), hsl(calc(var(--h) + 45) 60% 26%)); }
.tile b { font-size: 16px; } .tile small { opacity: 0.85; font-size: 12px; }
.ahead { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; margin: 4px 0 8px; }
.ahead h2 { margin: 6px 0 0; font-size: 24px; }
.backbtn { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; color: var(--muted); font-weight: 700; padding: 6px 0; min-height: 36px; }
.backbtn svg { width: 18px; height: 18px; }
.evbanner { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border-radius: 16px; text-decoration: none; border: 1px solid var(--line); background: radial-gradient(120% 120% at 0% 0%, var(--stage-a), transparent 60%), radial-gradient(120% 120% at 100% 100%, var(--stage-b), transparent 60%), var(--surface); }
.evbanner .k { font-size: 11px; font-weight: 700; color: var(--gold-ink); letter-spacing: 0.1em; }
.evbanner b { font-family: var(--font-display); font-size: 22px; font-weight: 400; }
.evbanner b i { font-style: normal; } .evbanner b i:first-of-type { color: var(--red); } .evbanner b i:last-of-type { color: var(--ice); }
.evbanner small { color: var(--muted); font-size: 12px; }
.evbox { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 10px; font-size: 14px; }
.evpick { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.ctrl { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 4px; }
.cbtn { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 0; background: none; display: grid; place-items: center; color: var(--fg); }
.cbtn svg { width: 24px; height: 24px; fill: currentColor; }
.cbtn svg.s { fill: none; }
.cbtn[aria-pressed="true"] { color: var(--gold-ink); }
.cbtn .one { position: absolute; font-style: normal; font-size: 9px; font-weight: 700; right: 8px; top: 8px; }
.scrub { margin: 8px 0; }
.track[data-seek] { height: 10px; cursor: pointer; }
.menu { display: flex; flex-direction: column; gap: 2px; }
.mitem { text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 14px 4px; font-size: 15px; font-weight: 500; }
.mitem[disabled] { opacity: 0.5; }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 13px; padding: 6px 0; align-self: center; }
.acts { grid-template-columns: 1fr 1fr 1fr; }
.vbtn svg.s { width: 16px; height: 16px; }
.acts .vbtn.liked svg { fill: var(--red); stroke: var(--red); }
.mini .pbtn svg { fill: currentColor; }
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="wm"><span class="wm-en">AI生成曲だけのストリーミング</span><span class="wm-jp">AI <i>MUSIC</i></span></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  'use strict';
  var DAILY = 3;
  var GENRES = ['J-POP', 'ロック', '演歌', 'バラード', 'アニソン', 'ヒップホップ', 'EDM', 'ジャズ', 'R&B', 'ローファイ', 'クラシック', 'その他'];
  var PERIODS = [['d', '日間'], ['w', '週間'], ['m', '月間'], ['y', '年間']];
  var TABS = [
    ['home', 'ホーム', '<path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>'],
    ['search', '検索', '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>'],
    ['library', 'ライブラリ', '<path d="M5 4v16M10 4v16M15 5l4 15"/>'],
    ['event', '紅白', '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/>'],
    ['my', 'マイページ', '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>']
  ];
  var ICON = {
    play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',
    next: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5l9 7-9 7zM17 5h2v14h-2z"/></svg>',
    prev: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5l-9 7 9 7zM5 5h2v14H5z"/></svg>',
    heart: '<svg class="s" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
    vote: '<svg class="s" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg>',
    share: '<svg class="s" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M5 14v5h14v-5"/></svg>',
    shuffle: '<svg class="s" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h4c4 0 5 10 9 10h5M3 17h4c1.5 0 2.5-1.4 3.4-3M14 8c.8-.7 1.7-1 2.6-1H21M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>',
    repeat: '<svg class="s" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11V9a3 3 0 0 1 3-3h13M17 3l3 3-3 3M20 13v2a3 3 0 0 1-3 3H4M7 21l-3-3 3-3"/></svg>',
    more: '<svg class="s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>',
    plus: '<svg class="s" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
    back: '<svg class="s" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>'
  };

  /* ---------- helpers ---------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function seedOf(id) {
    if (typeof id === 'number') { return id; }
    var h = 7, i, s = String(id);
    for (i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
    return h;
  }
  function fmt(n) { return n >= 10000 ? (n / 10000).toFixed(1) + '万' : n.toLocaleString('ja-JP'); }
  function full(n) { return n.toLocaleString('ja-JP'); }
  function mmss(s) {
    s = Math.max(0, Math.floor(s));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  function hueOf(s) {
    var h = 0, k;
    s = String(s);
    for (k = 0; k < s.length; k++) { h = (h * 31 + s.charCodeAt(k)) % 360; }
    return h;
  }
  function shuffled(a) {
    var b = a.slice(), i, j, t;
    for (i = b.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = b[i]; b[i] = b[j]; b[j] = t; }
    return b;
  }

  /* ---------- state ---------- */
  var RECOVERY = /type=recovery/.test(location.hash);
  var HASH_ERR = /error_code=|error=access_denied/.test(location.hash);
  var CFG = window.APP_CONFIG || {};
  var sb = null;
  if (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase && window.supabase.createClient) {
    try { sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY); } catch (e) { sb = null; }
  }
  var D = {
    tracks: [], scores: {}, comments: {}, myLikes: {}, left: DAILY, me: null, name: '', admin: false, judge: false, myScores: {},
    reveal: false, final: [], plays: {}, followers: {}, follows: {}, pls: [], plt: {}, recent: [], ready: false, err: '', sig: ''
  };
  var ui = { tab: 'home', route: 'home', arg: '', team: 'all', period: 'w', genre: 'all', sg: 'all', q: '', lib: 'pl', ev: 'battle', sheet: null };
  var CTX = {};
  var Q = { ids: [], i: -1, shuffle: false, repeat: 'off' };

  function num(x) { return typeof x === 'number' && isFinite(x) && x > 0 ? Math.floor(x) : 0; }
  function audioUrl(path) {
    if (!path || !sb) { return ''; }
    try { return sb.storage.from('tracks').getPublicUrl(path).data.publicUrl || ''; } catch (e) { return ''; }
  }
  function makeTrack(r) {
    var title = String(r.title || '無題'), hue = hueOf(title);
    return {
      id: String(r.id), uid: r.owner || null, mine: !!D.me && r.owner === D.me, n: Date.parse(r.created_at) || 0,
      title: title, artist: String(r.artist || '名無し'), team: r.team === 'red' ? 'red' : (r.team === 'ice' ? 'ice' : null),
      genre: GENRES.indexOf(r.genre) >= 0 ? r.genre : 'その他', tool: String(r.tool || 'その他'),
      status: r.status === 'approved' ? '公開' : (r.status === 'rejected' ? '非公開' : '審査中'),
      url: audioUrl(r.audio_path), hue: hue, bpm: 90 + (hue % 40), mode: hue % 2 ? 'minor' : 'major'
    };
  }
  function byId(id) {
    for (var i = 0; i < D.tracks.length; i++) { if (D.tracks[i].id === String(id)) { return D.tracks[i]; } }
    return null;
  }
  function votesOf(t, period) { var s = D.scores[t.id]; return s ? num(s[period]) : 0; }
  function likesOf(t) { var s = D.scores[t.id]; return s ? num(s.likes) : 0; }
  function playsOf(t) { var p = D.plays[t.id]; return p ? num(p.total) : 0; }
  function pop(t) { var p = D.plays[t.id]; return (p ? num(p.w) * 2 + num(p.total) : 0) + likesOf(t) * 3 + votesOf(t, 'y') * 2; }
  function isLiked(id) { return !!D.myLikes[String(id)]; }
  function left() { return D.me ? D.left : DAILY; }
  function commentsFor(t) { return D.comments[t.id] || []; }
  function visible() { return D.tracks.filter(function (t) { return t.status === '公開'; }); }
  function artists() {
    var m = {};
    visible().forEach(function (t) {
      var a = m[t.artist] || (m[t.artist] = { name: t.artist, ts: [], pop: 0 });
      a.ts.push(t); a.pop += pop(t);
    });
    return Object.keys(m).map(function (k) { return m[k]; }).sort(function (a, b) { return b.pop - a.pop; });
  }
  function ahref(name) { return '#artist/' + encodeURIComponent(name); }

  /* ---------- toast ---------- */
  var toastTimer = null;
  function toast(msg) {
    var el = $('#toast');
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 2800);
  }

  /* ---------- audio engine (音源がない曲は、30秒のサンプル音で再生) ---------- */
  var P = { t: null, playing: false, ctx: null, el: null, timer: null, step: 0, next: 0, start: 0, elapsed: 0, pat: null, stepDur: 0.25, counted: false };
  var DEMO_SEC = 30;
  function pattern(t) {
    var r = rng(seedOf(t.id) * 7919 + 13);
    var sc = t.mode === 'minor' ? [0, 3, 5, 7, 10] : [0, 2, 4, 7, 9];
    var root = [0, 2, 3, 5, 7, 9][Math.floor(r() * 6)];
    var mel = [], deg = 2, i;
    for (i = 0; i < 32; i++) {
      if (r() < 0.22) { mel.push(null); continue; }
      deg = Math.max(0, Math.min(9, deg + Math.round((r() - 0.5) * 4)));
      mel.push(root + sc[deg % 5] + 12 * Math.floor(deg / 5) + 12);
    }
    return { mel: mel, root: root, prog: [0, sc[2], sc[3], sc[2]] };
  }
  function hz(semi) { return 220 * Math.pow(2, semi / 12); }
  function tone(ctx, f, time, dur, type, vol) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(vol, time + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    o.connect(g); g.connect(P.master); o.start(time); o.stop(time + dur + 0.05);
  }
  function schedule(step, time) {
    var pat = P.pat, ctx = P.ctx;
    var m = pat.mel[step % 32];
    if (m !== null) { tone(ctx, hz(m), time, P.stepDur * 1.6, 'triangle', 0.5); }
    if (step % 4 === 0) {
      var chord = pat.prog[Math.floor(step / 8) % 4];
      tone(ctx, hz(pat.root + chord - 12), time, P.stepDur * 3.2, 'sine', 0.7);
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(140, time); o.frequency.exponentialRampToValueAtTime(45, time + 0.12);
      g.gain.setValueAtTime(0.5, time); g.gain.exponentialRampToValueAtTime(0.0001, time + 0.14);
      o.connect(g); g.connect(P.master); o.start(time); o.stop(time + 0.16);
    }
  }
  function pump() {
    var ctx = P.ctx;
    while (P.next < ctx.currentTime + 0.25) {
      schedule(P.step, P.next);
      P.next += P.stepDur; P.step++;
    }
  }
  function pos() {
    if (!P.t) { return 0; }
    if (P.el) { return P.el.currentTime || 0; }
    return P.playing && P.ctx ? Math.min(DEMO_SEC, P.ctx.currentTime - P.start) : P.elapsed;
  }
  function dur() {
    if (P.el) { return isFinite(P.el.duration) ? P.el.duration : 0; }
    return DEMO_SEC;
  }
  function halt() { clearInterval(P.timer); P.timer = null; }
  function pausePlayback() {
    if (!P.t) { return; }
    P.elapsed = pos();
    P.playing = false;
    halt();
    if (P.el) { P.el.pause(); }
    syncPlayer();
  }
  function startPlayback() {
    if (!P.t) { return; }
    if (P.el) {
      P.el.play().catch(function () { toast('この音源は再生できませんでした'); P.playing = false; syncPlayer(); });
      P.playing = true;
      syncPlayer();
      return;
    }
    try {
      if (!P.ctx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        P.ctx = new AC();
        P.master = P.ctx.createGain();
        P.master.gain.value = 0.22;
        P.master.connect(P.ctx.destination);
      }
      if (P.ctx.state === 'suspended') { P.ctx.resume(); }
    } catch (e) { toast('この環境では音を再生できません'); return; }
    P.pat = pattern(P.t);
    P.stepDur = 60 / P.t.bpm / 2;
    P.start = P.ctx.currentTime - P.elapsed;
    P.step = Math.round(P.elapsed / P.stepDur);
    P.next = P.ctx.currentTime + 0.05;
    P.playing = true;
    halt();
    P.timer = setInterval(function () {
      if (pos() >= DEMO_SEC) { onEnded(); return; }
      pump();
    }, 80);
    pump();
    syncPlayer();
  }
  function loadTrack(t, force) {
    if (!force && P.t && String(P.t.id) === String(t.id)) { return; }
    stopPlayback(true);
    P.t = t; P.elapsed = 0; P.counted = false;
    if (t.url) {
      P.el = new Audio(t.url);
      P.el.addEventListener('ended', onEnded);
    }
    mediaMeta(t);
  }
  function stopPlayback(clear) {
    halt();
    P.playing = false; P.elapsed = 0;
    if (P.el) { P.el.pause(); P.el = null; }
    if (clear) { P.t = null; }
    syncPlayer();
  }
  function togglePlayback() { if (P.playing) { pausePlayback(); } else { startPlayback(); } }
  function seekTo(ratio) {
    if (!P.t) { return; }
    ratio = Math.max(0, Math.min(1, ratio));
    if (P.el) { if (dur()) { P.el.currentTime = ratio * dur(); } syncPlayer(); return; }
    var was = P.playing;
    if (was) { pausePlayback(); }
    P.elapsed = ratio * DEMO_SEC;
    if (was) { startPlayback(); } else { syncPlayer(); }
  }

  /* ---------- queue ---------- */
  function playAt(i) {
    var t = byId(Q.ids[i]);
    if (!t) { return; }
    Q.i = i;
    loadTrack(t, true);
    startPlayback();
    if (ui.sheet && ui.sheet.k === 'track') { ui.sheet.id = t.id; drawSheet(); }
  }
  function playQueue(ids, startId, shuf) {
    ids = ids.filter(function (id) { return !!byId(id); });
    if (!ids.length) { return; }
    if (typeof shuf === 'boolean') { Q.shuffle = shuf; }
    if (Q.shuffle) {
      var rest = shuffled(ids.filter(function (x) { return x !== startId; }));
      Q.ids = startId ? [startId].concat(rest) : rest;
      Q.i = 0;
    } else {
      Q.ids = ids.slice();
      Q.i = Math.max(0, Q.ids.indexOf(startId));
    }
    playAt(Q.i);
    if (ui.sheet && ui.sheet.k === 'track') { drawSheet(); }
  }
  function playNext(id) {
    if (!byId(id)) { return; }
    if (!P.t || Q.i < 0) { playQueue([id], id); return; }
    Q.ids = Q.ids.filter(function (x, k) { return x !== id || k === Q.i; });
    Q.i = Q.ids.indexOf(P.t.id) >= 0 ? Q.ids.indexOf(P.t.id) : Q.i;
    Q.ids.splice(Q.i + 1, 0, id);
    toast('次に再生します');
  }
  function nextTrack(auto) {
    if (!Q.ids.length) { return; }
    if (auto && Q.repeat === 'one' && P.t) { var t = P.t; loadTrack(t, true); startPlayback(); return; }
    var i = Q.i + 1;
    if (i >= Q.ids.length) {
      if (Q.repeat === 'all') { i = 0; } else { stopPlayback(false); return; }
    }
    playAt(i);
  }
  function prevTrack() {
    if (pos() > 3) { seekTo(0); return; }
    if (!Q.ids.length) { return; }
    var i = Q.i - 1;
    if (i < 0) { i = Q.repeat === 'all' ? Q.ids.length - 1 : 0; }
    playAt(i);
  }
  function onEnded() { nextTrack(true); }
  function mediaMeta(t) {
    try {
      if ('mediaSession' in navigator && window.MediaMetadata) {
        navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, album: 'AI MUSIC' });
      }
    } catch (e) { /* 対応していない端末では何もしません */ }
  }
  try {
    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', function () { startPlayback(); });
      navigator.mediaSession.setActionHandler('pause', function () { pausePlayback(); });
      navigator.mediaSession.setActionHandler('nexttrack', function () { nextTrack(false); });
      navigator.mediaSession.setActionHandler('previoustrack', function () { prevTrack(); });
    }
  } catch (e2) { /* 同上 */ }

  function markNow() {
    var li = document.querySelectorAll('li[data-tid]'), i;
    for (i = 0; i < li.length; i++) {
      li[i].classList.toggle('now', !!P.t && li[i].getAttribute('data-tid') === String(P.t.id));
    }
  }
  function syncPlayer() {
    var t = P.t, mini = $('#mini');
    if (!t) { mini.hidden = true; mini.innerHTML = ''; }
    else {
      var pct = dur() ? Math.min(100, (pos() / dur()) * 100) : 0;
      if (mini.hidden || mini.getAttribute('data-id') !== String(t.id)) {
        mini.hidden = false;
        mini.setAttribute('data-id', t.id);
        mini.innerHTML =
          '<div class="mini" style="flex-wrap:wrap">' +
          '<button class="rowmain" data-act="np">' + cover(t) +
          '<span class="rt"><b>' + esc(t.title) + '</b><small>' + esc(t.artist) + (t.url ? '' : '・サンプル音') + '</small></span></button>' +
          '<button class="pbtn" data-act="toggle" id="mini-btn" aria-label="再生と一時停止"></button>' +
          '<button class="pbtn" data-act="next" aria-label="次の曲">' + ICON.next + '</button>' +
          '<div class="prog"><i id="mini-prog" style="display:block;height:100%;background:var(--gold);width:0"></i></div></div>';
        markNow();
      }
      $('#mini-btn').innerHTML = P.playing ? ICON.pause : ICON.play;
      $('#mini-prog').style.width = pct + '%';
    }
    var pb = $('#sheet-play'), s = ui.sheet;
    if (pb && s && s.k === 'track') {
      var on = !!(P.t && String(P.t.id) === String(s.id));
      pb.innerHTML = (P.playing && on) ? ICON.pause : ICON.play;
      $('#sheet-bar').style.width = (on && dur() ? Math.min(100, (pos() / dur()) * 100) : 0) + '%';
      $('#sheet-cur').textContent = mmss(on ? pos() : 0);
      $('#sheet-tot').textContent = mmss(on ? dur() : DEMO_SEC);
    }
  }
  setInterval(function () {
    if (!P.t) { return; }
    syncPlayer();
    if (P.playing && !P.counted && pos() >= 5) {
      P.counted = true;
      if (D.me && sb) { sb.rpc('record_play', { p_track: P.t.id }).then(function () {}, function () {}); }
    }
  }, 250);

  /* ---------- components ---------- */
  function cover(t, size) {
    var cls = size === 'lg' ? 'lg' : size === 'md' ? 'md' : '';
    return '<span class="cover ' + cls + '" style="--h:' + t.hue + '" aria-hidden="true">' + esc(Array.from(t.title)[0]) + '</span>';
  }
  function badge(team) {
    return '<span class="badge ' + team + '" title="' + (team === 'red' ? '紅組' : '白組') + '">' + (team === 'red' ? '紅' : '白') + '</span>';
  }
  function row(t, key, i, o) {
    o = o || {};
    var rk = o.rank ? '<span class="rank ' + (i < 3 ? 'm' + (i + 1) : '') + '">' + (i + 1) + '</span>' : '';
    var right = t.status !== '公開' ? '<span class="status">' + esc(t.status) + '</span>' : (o.right ? '<span class="rv tnum">' + o.right(t) + '</span>' : '');
    var cur = P.t && P.t.id === t.id;
    return '<li class="row' + (cur ? ' now' : '') + '" data-tid="' + esc(t.id) + '">' + rk +
      '<button class="rowmain" data-act="play" data-id="' + esc(t.id) + '" data-ctx="' + esc(key) + '" aria-label="' + esc(t.title) + 'を再生">' + cover(t) +
      '<span class="rt"><b>' + esc(t.title) + '</b><small>' + esc(t.artist) + (o.sub ? '・' + o.sub(t) : '') + '</small></span></button>' +
      (t.team ? badge(t.team) : '') + right +
      '<button class="pbtn" data-act="menu" data-id="' + esc(t.id) + '"' + (o.pl ? ' data-pl="' + esc(o.pl) + '"' : '') + ' aria-label="メニュー">' + ICON.more + '</button></li>';
  }
  function listHtml(ts, key, o) {
    CTX[key] = ts.map(function (t) { return t.id; });
    return '<ul class="list">' + ts.map(function (t, i) { return row(t, key, i, o); }).join('') + '</ul>';
  }
  function playsRight(t) { return fmt(playsOf(t)) + '回'; }
  function card(t, key) {
    return '<button class="card" data-act="play" data-id="' + esc(t.id) + '" data-ctx="' + esc(key) + '">' + cover(t, 'lg') +
      '<b>' + esc(t.title) + '</b><small>' + esc(t.artist) + '</small></button>';
  }
  function shelf(ts, key) {
    CTX[key] = ts.map(function (t) { return t.id; });
    return '<div class="shelf">' + ts.map(function (t) { return card(t, key); }).join('') + '</div>';
  }
  function artistCard(a) {
    return '<a class="card" href="' + ahref(a.name) + '"><span class="cover lg round" style="--h:' + hueOf(a.name) + '" aria-hidden="true">' + esc(Array.from(a.name)[0]) + '</span>' +
      '<b>' + esc(a.name) + '</b><small>' + a.ts.length + '曲</small></a>';
  }
  function playBar(key) {
    return '<div class="pair" style="margin:8px 0"><button class="vbtn gold" data-act="playall" data-ctx="' + key + '">' + ICON.play.replace('<svg', '<svg style="width:16px;height:16px;fill:currentColor"') + 'すべて再生</button>' +
      '<button class="vbtn line" data-act="shufall" data-ctx="' + key + '">' + ICON.shuffle + 'シャッフル</button></div>';
  }
  function empty(msg, cta) {
    return '<div class="emptybox"><p>' + msg + '</p>' + (cta || '') + '</div>';
  }
  function loginCta(msg) {
    return empty(msg, '<button class="cta" data-act="login-open">ログイン・新規登録する</button>');
  }
  function backBtn() { return '<button class="backbtn" data-act="back" aria-label="戻る">' + ICON.back + '戻る</button>'; }

  /* ---------- event helpers (紅白は、イベントとして独立) ---------- */
  function teamed() { return visible().filter(function (t) { return !!t.team; }); }
  function tally() {
    var r = 0, w = 0;
    teamed().forEach(function (t) { var v = votesOf(t, 'y'); if (t.team === 'red') { r += v; } else { w += v; } });
    return { r: r, w: w };
  }
  function topOf(team) {
    return teamed().filter(function (t) { return t.team === team; })
      .sort(function (a, b) { return votesOf(b, 'w') - votesOf(a, 'w'); }).slice(0, 3);
  }
  function pairs() {
    var r = topOf('red'), w = topOf('ice'), out = [], i;
    for (i = 0; i < Math.min(r.length, w.length); i++) { out.push([r[i], w[i]]); }
    return out;
  }
  function eventBanner() {
    var tl = tally();
    return '<a class="evbanner" href="#event"><span class="k">開催中のイベント</span><b>AI<i>紅</i><i>白</i>歌合戦</b>' +
      '<small>年末決戦まで あと <span class="tnum" data-cd="year">-</span>　紅 ' + full(tl.r) + '票 ／ 白 ' + full(tl.w) + '票</small></a>';
  }

  /* ---------- views ---------- */
  function viewHome() {
    var vs = visible();
    var head = '<section class="hero home"><p class="eyebrow">AIが作った音楽だけの、ストリーミング</p><h2>今日も、新しい曲に出会おう。</h2>' +
      (vs.length ? '<button class="cta" data-act="shufall" data-ctx="all">' + ICON.shuffle + 'おまかせシャッフル再生</button>' : '') + '</section>';
    if (!vs.length) {
      return head + empty('まだ公開されている曲がありません。最初の1曲を投稿してみませんか。', '<a class="cta" href="#submit">曲を投稿する</a>') + '<div class="sec">' + eventBanner() + '</div>';
    }
    CTX.all = vs.map(function (t) { return t.id; });
    var fresh = vs.slice().sort(function (a, b) { return b.n - a.n; }).slice(0, 12);
    var hot = vs.slice().sort(function (a, b) { return pop(b) - pop(a); }).slice(0, 5);
    var ars = artists().slice(0, 12);
    var recent = D.recent.map(byId).filter(function (t) { return t && t.status === '公開'; });
    var h = head;
    if (recent.length) { h += '<section class="sec"><div class="sec-h"><h3>最近聴いた曲</h3></div>' + shelf(recent, 'recent') + '</section>'; }
    h += '<section class="sec"><div class="sec-h"><h3>新着</h3></div>' + shelf(fresh, 'fresh') + '</section>';
    h += '<section class="sec"><div class="sec-h"><h3>人気の曲</h3></div>' + listHtml(hot, 'hot', { rank: true, right: playsRight }) + '</section>';
    h += '<section class="sec"><div class="sec-h"><h3>ジャンル</h3><a href="#search">すべて見る</a></div><div class="chips">' +
      GENRES.map(function (g) { return '<button class="chip" data-act="sg-go" data-v="' + esc(g) + '">' + esc(g) + '</button>'; }).join('') + '</div></section>';
    if (ars.length) { h += '<section class="sec"><div class="sec-h"><h3>注目のアーティスト</h3></div><div class="shelf">' + ars.map(artistCard).join('') + '</div></section>'; }
    h += '<section class="sec">' + eventBanner() + '</section>';
    return h;
  }

  function searchBody() {
    var q = ui.q.trim().toLowerCase(), vs = visible();
    if (!q && ui.sg === 'all') {
      return '<h3 class="h3">ジャンルから探す</h3><div class="tiles">' + GENRES.map(function (g, i) {
        var n = vs.filter(function (t) { return t.genre === g; }).length;
        return '<button class="tile" style="--h:' + (i * 29 + 10) + '" data-act="sg" data-v="' + esc(g) + '"><b>' + esc(g) + '</b><small>' + n + '曲</small></button>';
      }).join('') + '</div>';
    }
    var ts = vs.filter(function (t) {
      return (ui.sg === 'all' || t.genre === ui.sg) && (!q || (t.title + ' ' + t.artist).toLowerCase().indexOf(q) >= 0);
    }).sort(function (a, b) { return pop(b) - pop(a); });
    var ar = (ui.sg === 'all' && q) ? artists().filter(function (a) { return a.name.toLowerCase().indexOf(q) >= 0; }) : [];
    return '<div class="chips" role="group" aria-label="ジャンル">' + ['all'].concat(GENRES).map(function (g) {
      return '<button class="chip" data-act="sg" data-v="' + esc(g) + '" aria-pressed="' + (ui.sg === g) + '">' + (g === 'all' ? 'すべて' : esc(g)) + '</button>';
    }).join('') + '</div>' +
      (ar.length ? '<h3 class="h3">アーティスト</h3><div class="shelf">' + ar.map(artistCard).join('') + '</div>' : '') +
      (ts.length ? '<h3 class="h3">曲</h3>' + listHtml(ts, 'search', { right: playsRight }) : '<p class="sub">見つかりませんでした。別の言葉で探してみてください。</p>');
  }
  function viewSearch() {
    return '<div class="stack"><input type="search" class="sbox" id="s-q" placeholder="曲名・アーティスト名" value="' + esc(ui.q) + '" autocomplete="off" enterkeyhint="search" aria-label="検索">' +
      '<div id="s-res" class="stack">' + searchBody() + '</div></div>';
  }

  function viewLibrary() {
    if (!D.me) { return '<h2 class="ttl">ライブラリ</h2>' + loginCta('ログインすると、プレイリスト・お気に入り・フォロー中のアーティストがここに並びます。'); }
    var tabs = [['pl', 'プレイリスト'], ['fav', 'お気に入り'], ['fol', 'フォロー中'], ['up', '投稿']];
    var body = '';
    if (ui.lib === 'pl') {
      body = '<button class="vbtn line" style="min-height:44px;width:100%;display:flex;gap:6px;align-items:center;justify-content:center" data-act="pl-new">' + ICON.plus + '新しいプレイリスト</button>' +
        (D.pls.length ? '<ul class="list">' + D.pls.map(function (p) {
          var n = (D.plt[p.id] || []).length;
          return '<li class="row"><a class="rowmain" href="#playlist/' + esc(p.id) + '"><span class="cover md" style="--h:' + hueOf(p.name) + '" aria-hidden="true">♪</span>' +
            '<span class="rt"><b>' + esc(p.name) + '</b><small>' + n + '曲</small></span></a></li>';
        }).join('') + '</ul>' : '<p class="sub">まだプレイリストがありません。好きな曲を集めて、自分だけの1枚をつくりましょう。</p>');
    } else if (ui.lib === 'fav') {
      var liked = visible().filter(function (t) { return isLiked(t.id); });
      body = liked.length ? playBar('fav') + listHtml(liked, 'fav', { right: playsRight }) : '<p class="sub">曲のハートを押すと、ここに並びます。</p>';
    } else if (ui.lib === 'fol') {
      var names = Object.keys(D.follows);
      body = names.length ? '<ul class="list">' + names.map(function (n) {
        var cnt = visible().filter(function (t) { return t.artist === n; }).length;
        return '<li class="row"><a class="rowmain" href="' + ahref(n) + '"><span class="cover round md" style="--h:' + hueOf(n) + '" aria-hidden="true">' + esc(Array.from(n)[0]) + '</span>' +
          '<span class="rt"><b>' + esc(n) + '</b><small>' + cnt + '曲</small></span></a></li>';
      }).join('') + '</ul>' : '<p class="sub">アーティストのページで「フォロー」を押すと、ここに並びます。</p>';
    } else {
      var mine = D.tracks.filter(function (t) { return t.mine; });
      body = '<a class="cta" href="#submit">曲を投稿する</a>' +
        (mine.length ? listHtml(mine, 'mine', { right: playsRight }) : '<p class="sub">まだ投稿がありません。</p>');
    }
    return '<h2 class="ttl">ライブラリ</h2><div class="stack"><div class="seg" role="group" aria-label="ライブラリ">' + tabs.map(function (x) {
      return '<button data-act="lib" data-v="' + x[0] + '" aria-pressed="' + (ui.lib === x[0]) + '">' + x[1] + '</button>';
    }).join('') + '</div>' + body + '</div>';
  }

  function viewArtist() {
    var name = ui.arg, ts = visible().filter(function (t) { return t.artist === name; }).sort(function (a, b) { return pop(b) - pop(a); });
    if (!ts.length) { return backBtn() + empty('このアーティストの公開曲は見つかりませんでした。'); }
    var fol = !!D.follows[name], n = num(D.followers[name]);
    return backBtn() + '<section class="ahead"><span class="cover round xl" style="--h:' + hueOf(name) + '" aria-hidden="true">' + esc(Array.from(name)[0]) + '</span>' +
      '<h2>' + esc(name) + '</h2><p class="sub">' + ts.length + '曲・フォロワー ' + fmt(n) + '人・再生 ' + fmt(ts.reduce(function (s, t) { return s + playsOf(t); }, 0)) + '回</p>' +
      '<button class="vbtn ' + (fol ? 'line' : 'gold') + '" style="min-height:44px;padding:0 28px" data-act="follow" data-v="' + esc(name) + '" aria-pressed="' + fol + '">' + (fol ? 'フォロー中' : 'フォロー') + '</button></section>' +
      playBar('artist') + listHtml(ts, 'artist', { right: playsRight });
  }

  function viewPlaylist() {
    var p = null, i;
    for (i = 0; i < D.pls.length; i++) { if (D.pls[i].id === ui.arg) { p = D.pls[i]; } }
    if (!p) { return backBtn() + empty(D.me ? 'プレイリストが見つかりませんでした。' : 'ログインすると見られます。'); }
    var ts = (D.plt[p.id] || []).map(byId).filter(Boolean);
    return backBtn() + '<section class="ahead"><span class="cover xl" style="--h:' + hueOf(p.name) + '" aria-hidden="true">♪</span><h2>' + esc(p.name) + '</h2>' +
      '<p class="sub">' + ts.length + '曲</p><button class="vbtn line" style="min-height:40px;padding:0 20px" data-act="pl-del" data-id="' + esc(p.id) + '">プレイリストを削除</button></section>' +
      (ts.length ? playBar('pl') + listHtml(ts, 'pl', { right: playsRight, pl: p.id }) : '<p class="sub" style="text-align:center">曲のメニュー「プレイリストに追加」で、曲を入れられます。</p>');
  }

  /* 紅白歌合戦（イベント） */
  function viewEvent() {
    var tl = tally(), total = tl.r + tl.w, pr = total ? (tl.r / total) * 100 : 50;
    var lead = tl.r === tl.w ? '現在は同点です' : (tl.r > tl.w ? '現在：紅組リード +' : '現在：白組リード +') + full(Math.abs(tl.r - tl.w)) + '票';
    var hero = '<section class="hero"><p class="eyebrow">年末決戦まで あと <b class="tnum" data-cd="year">-</b></p>' +
      '<h2>AI紅白歌合戦</h2><p class="sub" style="margin:0 0 12px">AI MUSICで開かれる、年末のイベントです。曲を投稿するときに「エントリー」すると、紅組か白組で出場できます。</p>' +
      '<div class="vs"><div class="side red"><span class="k">紅組</span><b class="tnum">' + full(tl.r) + '</b><small>票</small></div><div class="vsmark">VS</div>' +
      '<div class="side ice"><span class="k">白組</span><b class="tnum">' + full(tl.w) + '</b><small>票</small></div></div>' +
      '<div class="bar" role="img" aria-label="紅組 ' + Math.round(pr) + '%、白組 ' + Math.round(100 - pr) + '%"><i style="width:' + pr.toFixed(1) + '%"></i></div>' +
      '<p class="lead">' + lead + '</p><a class="cta" href="#submit">この曲で紅白にエントリーする</a></section>';
    var tabs = [['battle', '対決'], ['ranking', 'ランキング'], ['gp', '年間GP']];
    var body = ui.ev === 'ranking' ? evRanking() : ui.ev === 'gp' ? gpBody() : evBattle();
    return '<div class="stack">' + hero + '<div class="seg" role="group" aria-label="イベントの内容">' + tabs.map(function (x) {
      return '<button data-act="ev-tab" data-v="' + x[0] + '" aria-pressed="' + (ui.ev === x[0]) + '">' + x[1] + '</button>';
    }).join('') + '</div>' + body + '</div>';
  }
  function evBattle() {
    var ps = pairs();
    return '<div class="meta"><div class="box"><small>今週の対決 終了まで</small><b class="tnum" data-cd="round">-</b></div>' +
      '<div class="box"><small>今日の残り投票</small><b class="tnum">' + (D.me ? left() + ' / ' + DAILY : 'ログインで' + DAILY + '票') + '</b></div></div>' +
      '<p class="sub">1日' + DAILY + '票まで。同じ曲に何票でも使えます。対戦カードは、今週の得票が多い紅組と白組の曲から自動で組みます。</p>' +
      (ps.length ? ps.map(function (m) { return matchCard(m[0], m[1]); }).join('') : empty('紅組と白組の曲がそろうと、対戦カードが表示されます。'));
  }
  function evRanking() {
    var list = teamed().filter(function (t) {
      return (ui.team === 'all' || t.team === ui.team) && (ui.genre === 'all' || t.genre === ui.genre);
    }).sort(function (a, b) { return votesOf(b, ui.period) - votesOf(a, ui.period); });
    var teams = [['all', '総合', ''], ['red', '紅組', 'red'], ['ice', '白組', 'ice']];
    return '<div class="seg" role="group" aria-label="陣営">' + teams.map(function (x) {
      return '<button data-act="f-team" data-v="' + x[0] + '" data-team="' + x[2] + '" aria-pressed="' + (ui.team === x[0]) + '">' + x[1] + '</button>';
    }).join('') + '</div>' +
      '<div class="seg" role="group" aria-label="期間">' + PERIODS.map(function (x) {
        return '<button data-act="f-period" data-v="' + x[0] + '" aria-pressed="' + (ui.period === x[0]) + '">' + x[1] + '</button>';
      }).join('') + '</div>' +
      '<div class="chips" role="group" aria-label="ジャンル">' + ['all'].concat(GENRES).map(function (g) {
        return '<button class="chip" data-act="f-genre" data-v="' + esc(g) + '" aria-pressed="' + (ui.genre === g) + '">' + (g === 'all' ? 'すべて' : esc(g)) + '</button>';
      }).join('') + '</div>' +
      (list.length ? listHtml(list, 'evrank', { rank: true, right: function (t) { return fmt(votesOf(t, ui.period)) + '票'; } })
        : '<p class="sub">この条件でエントリーしている曲はまだありません。</p>');
  }
  function gpBody() {
    if (!D.reveal && !D.admin) {
      return '<div class="emptybox"><p><b>年間グランプリの結果は、年末の発表までお待ちください</b></p>' +
        '<p class="hint">一般投票と審査員評価を合わせて決まります。ルールは<a href="terms.html#grand">こちら</a>。</p></div>';
    }
    if (!D.final.length) { return '<p class="sub">集計できる曲がまだありません。</p>'; }
    return (D.reveal ? '' : '<p class="hint">運営者にだけ表示しています。まだ全員には公開されていません。</p>') +
      '<ul class="list">' + D.final.map(function (f) {
        var t = byId(f.track_id);
        if (!t || !t.team) { return ''; }
        var rk = num(f.rank);
        return '<li class="row" data-tid="' + esc(t.id) + '"><span class="rank ' + (rk <= 3 ? 'm' + rk : '') + '">' + rk + '</span>' +
          '<button class="rowmain" data-act="play" data-id="' + esc(t.id) + '">' + cover(t) +
          '<span class="rt"><b>' + esc(t.title) + '</b><small>' + esc(t.artist) + '・一般 ' + Number(f.pub_score).toFixed(1) + '／審査員 ' + Number(f.judge_score).toFixed(1) + '</small></span></button>' +
          badge(t.team) + '<span class="rv tnum">' + Number(f.total).toFixed(1) + '点</span></li>';
      }).join('') + '</ul><p class="hint">総合点は100点満点です。一般投票と審査員評価を合わせた点数で、割合は<a href="terms.html#grand">ルール</a>に書いてあります。</p>';
  }
  function matchCard(a, b) {
    var va = votesOf(a, 'w'), vb = votesOf(b, 'w'), sum = va + vb, pa = sum ? (va / sum) * 100 : 50;
    var dis = D.me && left() === 0 ? ' disabled' : '';
    function cand(t, cls) {
      return '<div class="cand"><button class="rowmain" style="flex-direction:column" data-act="play" data-id="' + esc(t.id) + '" aria-label="' + esc(t.title) + 'を再生">' + cover(t) + '</button>' +
        '<b>' + esc(t.title) + '</b><small>' + esc(t.artist) + '</small>' +
        '<span class="votes tnum">' + full(votesOf(t, 'w')) + '票</span>' +
        '<div class="pair"><button class="vbtn ' + cls + '" data-act="vote" data-id="' + esc(t.id) + '"' + dis + '>' + (t.team === 'red' ? '紅組に投票' : '白組に投票') + '</button></div></div>';
    }
    return '<div class="match"><div class="duel">' + cand(a, 'red') + '<span class="vsc">VS</span>' + cand(b, 'ice') + '</div>' +
      '<div class="share-bar" role="img" aria-label="' + esc(a.title) + ' ' + Math.round(pa) + '%、' + esc(b.title) + ' ' + Math.round(100 - pa) + '%"><i style="width:' + pa.toFixed(1) + '%"></i></div></div>';
  }

  var formTeam = 'red';
  function viewSubmit() {
    if (!D.me) { return '<h2 class="ttl">曲を投稿</h2>' + loginCta('曲の投稿にはログインが必要です。'); }

      '<div class="field"><label for="f-genre">ジャンル</label><select id="f-genre">' + GENRES.map(function (g) { return '<option>' + esc(g) + '</option>'; }).join('') + '</select></div>' +

      '<div class="field"><label for="f-plan">利用プラン</label><select id="f-plan"><option value="paid">有料プラン</option><option value="free">無料プラン</option><option value="unknown">わからない</option></select>' +
      '<p class="hint">無料プランやわからない場合は、審査で権利の確認が入ります。</p></div>' +
      '<div class="field"><label for="f-file">音源ファイル（mp3・wavなど、20MBまで）</label><input type="file" id="f-file" accept="audio/*">' +
      '<p class="hint">選ばない場合は、サンプル音で再生されます。</p></div>' +
      '<div class="evpick"><label class="check"><input type="checkbox" id="c-entry"><span><b>AI紅白歌合戦にエントリーする</b>（任意）<br><small>年末のイベントに、この曲で出場します。</small></span></label>' +
      '<div id="entry-team" hidden><div class="seg" role="radiogroup" aria-label="陣営">' +

      '<div class="checks">' +
      '<label class="check"><input type="checkbox" id="c-ai"><span>この曲はAIで生成しました</span></label>' +

      '<label class="check"><input type="checkbox" id="c-term"><span>再生・共有・イベントでの利用を許可します（著作権は投稿者に残ります）。<a href="terms.html#rights" target="_blank" rel="noopener">投稿ルール</a>を読みました</span></label></div>' +
      '<p class="err" id="f-err" role="alert"></p>' +
      '<button class="cta" type="submit" id="f-go">審査に出す</button></form>';

  function viewMy() {
    if (!D.me) { return '<h2 class="ttl">マイページ</h2>' + loginCta('ログインすると、アカウントの設定ができます。'); }
    var pending = D.admin ? D.tracks.filter(function (t) { return t.status === '審査中'; }) : [];
    var judgeSec = '';
    if (D.judge) {
      var jl = teamed();
      judgeSec = '<section class="sec" style="margin-top:8px"><div class="sec-h"><h3>審査員：評価する曲</h3></div>' +
        '<p class="sub">年間グランプリの審査員です。曲を開くと、3項目を5段階で評価できます。評価は他の人には見えません。</p>' +
        (jl.length ? '<ul class="list">' + jl.map(function (t) {
          var sc = D.myScores[t.id];
          return '<li class="row"><button class="rowmain" data-act="np-track" data-id="' + esc(t.id) + '">' + cover(t) +
            '<span class="rt"><b>' + esc(t.title) + '</b><small>' + esc(t.artist) + '</small></span></button>' +
            '<span class="status">' + (sc ? '評価済 ' + (sc.c1 + sc.c2 + sc.c3) + '/15' : '未評価') + '</span></li>';

  function errText(e) {
    var m = String((e && (e.message || e.details)) || e || '');
    if (m.indexOf('daily_limit') >= 0) { return '今日の投票はここまでです。明日また投票できます'; }

    if (/schema cache|does not exist|PGRST20[0-9]|42P01/.test(m + ' ' + String((e && e.code) || ''))) { return 'この機能の準備（schema_music.sql）がまだ終わっていません'; }
    return '処理できませんでした。しばらくしてからもう一度お試しください';
  }
  async function load() {
    if (!sb) { return; }
    try {
      var q = [
        sb.from('tracks').select('id,owner,title,artist,team,genre,tool,audio_path,status,created_at').order('created_at', { ascending: false }).limit(500),
        sb.from('track_scores').select('track_id,d,w,m,y,likes'),
        sb.from('comments').select('id,track_id,user_id,body,created_at,profiles(name)').order('created_at', { ascending: true }).limit(500)
      ];
      if (D.me) {
        q.push(sb.from('likes').select('track_id'));
        q.push(sb.rpc('my_votes_today'));
      }
      var r = await Promise.all(q), i;
      for (i = 0; i < r.length; i++) { if (r[i].error) { throw r[i].error; } }
      var tracks = (r[0].data || []).map(makeTrack);
      var scores = {};
      (r[1].data || []).forEach(function (s) { scores[String(s.track_id)] = s; });
      var comments = {};
      (r[2].data || []).forEach(function (c) {
        var k = String(c.track_id);
        var nm = c.user_id === D.me ? 'あなた' : ((c.profiles && c.profiles.name) || 'リスナー');
        (comments[k] = comments[k] || []).push({ n: nm, t: String(c.body || '').slice(0, 80) });
      });
      var likes = {}, leftNow = DAILY;
      if (D.me) {
        (r[3].data || []).forEach(function (l) { likes[String(l.track_id)] = true; });
        leftNow = Math.max(0, DAILY - num(r[4].data));
      }
      var reveal = false, myScores = {}, fin = [];
      try {
        var rv = await sb.from('app_settings').select('value').eq('key', 'reveal').maybeSingle();
        reveal = !!(rv.data && (rv.data.value === true || rv.data.value === 'true'));
        if (D.me && D.judge) {
          var js = await sb.from('judge_scores').select('track_id,c1,c2,c3,comment');
          (js.data || []).forEach(function (x) { myScores[String(x.track_id)] = { c1: num(x.c1), c2: num(x.c2), c3: num(x.c3), comment: x.comment || '' }; });
        }
        if (reveal || D.admin) {
          var fr = await sb.rpc('final_ranking');
          fin = fr.error ? [] : (fr.data || []);
        }
      } catch (x) { /* schema_judges.sql が未実行でも、ほかの機能は動かします */ }
      var plays = {}, followers = {}, follows = {}, pls = [], plt = {}, recent = [];
      try {
        var ex = [sb.from('track_plays').select('track_id,total,w'), sb.from('artist_followers').select('artist,n')];
        if (D.me) {
          ex.push(sb.from('follows').select('artist'));
          ex.push(sb.from('playlists').select('id,name,created_at').eq('owner', D.me).order('created_at', { ascending: false }));
          ex.push(sb.from('playlist_tracks').select('playlist_id,track_id,added_at').order('added_at', { ascending: true }).limit(5000));
          ex.push(sb.rpc('my_recent_tracks', { p_limit: 20 }));
        }
        var er = await Promise.all(ex);
        if (!er[0].error) { (er[0].data || []).forEach(function (p) { plays[String(p.track_id)] = { total: num(p.total), w: num(p.w) }; }); }
        if (!er[1].error) { (er[1].data || []).forEach(function (a) { followers[a.artist] = num(a.n); }); }
        if (D.me) {
          if (!er[2].error) { (er[2].data || []).forEach(function (f) { follows[f.artist] = true; }); }
          if (!er[3].error) { pls = (er[3].data || []).map(function (p) { return { id: String(p.id), name: String(p.name) }; }); }
          var mine = {};
          pls.forEach(function (p) { mine[p.id] = true; plt[p.id] = []; });
          if (!er[4].error) { (er[4].data || []).forEach(function (x) { var k = String(x.playlist_id); if (mine[k]) { plt[k].push(String(x.track_id)); } }); }
          if (!er[5].error) { recent = (er[5].data || []).map(function (x) { return String(x.track_id); }); }
        }
      } catch (y) { /* schema_music.sql が未実行でも、曲を聴く機能は動かします */ }
      var sig = JSON.stringify([tracks, scores, comments, likes, leftNow, D.me, D.name, D.admin, D.judge, reveal, myScores, fin, plays, followers, follows, pls, plt, recent]);
      D.err = '';
      D.ready = true;
      if (sig !== D.sig) {
        D.sig = sig; D.tracks = tracks; D.scores = scores; D.comments = comments; D.myLikes = likes; D.left = leftNow;
        D.reveal = reveal; D.myScores = myScores; D.final = fin; D.plays = plays; D.followers = followers; D.follows = follows;
        D.pls = pls; D.plt = plt; D.recent = recent;
        changed();
      } else if (!$('#view').firstChild) { changed(); }
    } catch (e) {
      D.err = 'データを読み込めませんでした。通信を確認してください';
      changed();
    }
  }
  var changeTimer = null;
  function changed() {
    clearTimeout(changeTimer);
    changeTimer = setTimeout(function () {

    var txt = Math.floor(s / 86400) + '日 ' + String(Math.floor(s % 86400 / 3600)).padStart(2, '0') + ':' + String(Math.floor(s % 3600 / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    for (i = 0; i < r.length; i++) { r[i].textContent = txt; }
  }
  setInterval(tickCountdown, 1000);

  /* ---------- routing ---------- */
  function route() {
    var raw = location.hash.replace(/^#/, ''), parts = raw.split('/'), r = parts[0], arg = parts.slice(1).join('/');
    if (r === 'ranking' || r === 'battle') { ui.ev = r === 'ranking' ? 'ranking' : 'battle'; r = 'event'; }
    try { arg = decodeURIComponent(arg); } catch (e) { /* そのまま使います */ }
    if (!VIEWS[r]) { r = 'home'; }
    ui.route = r; ui.arg = arg; ui.tab = TAB_OF[r];
    render();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
  syncPlayer();
  connect();
})();
</script>
<script>if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }</script>
